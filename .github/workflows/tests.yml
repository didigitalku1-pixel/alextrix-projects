name: Tests

# Runs the Vitest test suite on every PR and push to main.
# Tests hit the live Vercel production URL by default (smoke / integration tests).
# Schema validation tests talk to Supabase directly with the public anon key.
#
# To run tests against a local dev server instead, set TEST_TARGET=http://localhost:3000
# in the workflow env (useful for testing PRs before they're deployed).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run unit tests (no network)
        run: bun run vitest run tests/unit/
        env:
          # Skip integration tests that need network
          VITEST_SKIP_NETWORK: "1"

      - name: Run schema validation tests
        # These tests catch the bug we just fixed (column doesn't exist).
        # They run against Supabase directly with the public anon key (read-only).
        run: bun run vitest run tests/api/schema-validation.test.ts

      - name: Run full test suite (unit + integration)
        # Hits the production Vercel URL — set TEST_TARGET to override.
        run: bun run test
        env:
          TEST_TARGET: ${{ vars.TEST_TARGET || 'https://web-library-coral.vercel.app' }}

      - name: Upload coverage if generated
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7
