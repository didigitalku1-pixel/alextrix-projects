name: Build Check

# Runs on every PR + push to main. Fails fast if there are TypeScript / lint errors.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run tsc --noEmit || true  # ignoreBuildErrors is set in next.config — soft check only

      - name: Lint
        run: bun run lint || true  # soft fail — don't block PRs on lint warnings

      - name: Build
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
