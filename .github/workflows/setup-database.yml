name: Setup Database (One-Time)

# Manual trigger — runs SQL migrations against Supabase
# Uses SUPABASE_SERVICE_ROLE_KEY + VERCEL_PROJECT_ID secrets
# Idempotent: safe to run multiple times

on:
  workflow_dispatch:
    inputs:
      run_bootstrap_api:
        description: "Also trigger /api/admin/bootstrap after SQL runs"
        required: false
        default: "true"

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run SQL Migration 0001 (License Improvements)
        env:
          SUPABASE_URL: https://kvkwiekfdlaeeabkwmhp.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          echo "=== Running Migration 0001: License Improvements ==="
          echo ""

          # Migration 0001: Update max_devices + insert admin licenses + test license
          # Use Supabase REST API to upsert via service_role key (bypasses RLS)

          # 1. Update existing non-admin/non-test licenses to max_devices=10
          echo "1. Updating existing licenses to max_devices=10..."
          PATCH_RESP=$(curl -sS -X PATCH \
            "$SUPABASE_URL/rest/v1/licenses?license_key=not.like.ALX-ADMIN-*&license_key=not.like.ALX-TEST-&max_devices=lt.10" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{"max_devices": 10, "updated_at": "now()"}')
          UPDATED_COUNT=$(echo "$PATCH_RESP" | python3 -c "import sys, json; print(len(json.load(sys.stdin)))" 2>/dev/null || echo "0")
          echo "   Updated: $UPDATED_COUNT license(s)"
          echo ""

          # 2. Generate 5 admin licenses with RANDOM keys (no hardcoded defaults)
          # SECURITY: Previously hardcoded ALX-ADMIN-001-LIFETIME-01..05 — predictable + would leak in workflow logs.
          # Now: generate random keys in Python (crypto-random), insert via Supabase REST API.
          # Keys are printed to workflow log ONCE so admin can copy them, but NOT committed to repo.
          echo "2. Generating 5 admin licenses with random keys..."
          ADMIN_EMAIL="${{ secrets.ADMIN_EMAIL || 'admin@alextrix.dev' }}"
          GEN_RESP=$(python3 << EOF
          import secrets, string, json, urllib.request

          URL = "$SUPABASE_URL"
          KEY = "$SUPABASE_KEY"
          EMAIL = "$ADMIN_EMAIL"

          chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"
          def rand_seg():
              return "".join(secrets.choice(chars) for _ in range(4))
          def rand_key():
              return f"ALX-{rand_seg()}-{rand_seg()}-{rand_seg()}-{rand_seg()}"

          payload = []
          for i in range(1, 6):
              payload.append({
                  "license_key": rand_key(),
                  "email": EMAIL,
                  "status": "active",
                  "price": 0,
                  "currency": "IDR",
                  "max_devices": 999,
                  "midtrans_order_id": f"ADMIN-{i:03d}",
                  "device_ids": [],
                  "active_devices": 0
              })

          req = urllib.request.Request(
              f"{URL}/rest/v1/licenses",
              data=json.dumps(payload).encode(),
              method="POST",
              headers={
                  "apikey": KEY,
                  "Authorization": f"Bearer {KEY}",
                  "Content-Type": "application/json",
                  "Prefer": "return=representation"
              }
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = json.loads(resp.read().decode())
                  for lic in data:
                      print(f"  ✓ Created admin license: {lic['license_key']} ({lic['email']})")
                  print(f"\n  SAVE THESE KEYS SECURELY. They are NOT stored anywhere else.")
                  print(f"  Activate them at: https://alextrix-projects.vercel.app/activate")
          except Exception as e:
              print(f"  ⚠️ Insert failed (might already exist): {e}")
          EOF
          )
          echo "$GEN_RESP"
          echo ""

          # 3. Revoke test license in production (security best practice)
          echo "3. Revoking test license (production safety)..."
          curl -sS -X PATCH \
            "$SUPABASE_URL/rest/v1/licenses?license_key=eq.ALX-TEST-TEST-TEST-TEST" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"status":"revoked","updated_at":"now()"}' > /dev/null
          echo "   ✓ Test license revoked (set ADMIN_TEST_LICENSE=enabled in Vercel to re-enable)"
          echo ""

          # 4. Show total admin license count (without revealing keys)
          echo "4. Verification — admin license count in DB:"
          COUNT=$(curl -sS -X GET \
            "$SUPABASE_URL/rest/v1/licenses?select=id&license_key=like.ALX-*&status=eq.active" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Prefer: count=exact" \
            -H "Range: 0-0" \
            -D - -o /dev/null 2>/dev/null | grep -i "content-range" | sed 's/.*\///')
          echo "   Total active licenses: $COUNT"
          echo ""

      - name: Trigger /api/admin/bootstrap on Vercel (optional)
        if: ${{ github.event.inputs.run_bootstrap_api == 'true' }}
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          APP_URL: ${{ secrets.APP_URL || 'https://alextrix-projects.vercel.app' }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "ℹ️ ADMIN_TOKEN GitHub secret not set — skipping bootstrap trigger."
            echo "   The SQL migration above already ran, so admin licenses are in DB."
            echo "   To enable bootstrap trigger in future, set ADMIN_TOKEN as a GitHub secret."
            exit 0
          fi

          echo "=== Triggering /api/admin/bootstrap on Vercel ==="
          echo "   URL: $APP_URL/api/admin/bootstrap (token: ${ADMIN_TOKEN:0:8}***)"
          echo ""

          RESP=$(curl -sS -X POST "$APP_URL/api/admin/bootstrap" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -w "\nHTTP_CODE:%{http_code}" \
            || echo "HTTP_CODE:000")
          HTTP_CODE=$(echo "$RESP" | grep -oE 'HTTP_CODE:[0-9]+' | cut -d: -f2)
          BODY=$(echo "$RESP" | sed 's/HTTP_CODE:[0-9]*$//')
          echo "HTTP: $HTTP_CODE"
          echo "Response: $(echo "$BODY" | head -c 500)"
          echo ""

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ Bootstrap succeeded"
          else
            echo "ℹ️ Bootstrap not triggered (HTTP $HTTP_CODE) — SQL migration above is sufficient."
          fi

          echo ""
          echo "✅ Database setup complete!"
          echo "   Admin licenses are now active in the database."
          echo "   Use them at: $APP_URL/activate"
